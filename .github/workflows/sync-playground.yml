name: Sync to Playground

on:
  push:
    branches:
      - 1.x
  workflow_call:
    inputs:
      target-branch:
        required: false
        type: string
        default: playground
      force-folder:
        required: false
        type: string
        default: build/

jobs:
  build-and-push:
    uses: lubusIN/.github/.github/workflows/sync-playground.yml@main
    with:
      target-branch: ${{ github.event_name == 'workflow_call' && inputs.target-branch || 'playground' }}
      force-folder: ${{ github.event_name == 'workflow_call' && inputs.force-folder || 'build/' }}
    secrets: inherit
